spring.application.name=time-deposit

# Schema is owned by Flyway; Hibernate only validates the mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Default connection for a local Postgres (see docker-compose.yml). Tests use Testcontainers instead.
spring.datasource.url=jdbc:postgresql://localhost:5432/timedeposit
spring.datasource.username=timedeposit
spring.datasource.password=timedeposit

# db/seed holds demo data for the running app only; tests set this to db/migration alone.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Elastic Common Schema JSON on the console, so ELK (Filebeat/Logstash) can ingest it without parsing rules.
logging.structured.format.console=ecs
