spring.application.name=time-deposit

# Schema is owned by Flyway; Hibernate only validates the mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Default connection for a local Postgres (see docker-compose.yml). Tests use Testcontainers instead.
spring.datasource.url=jdbc:postgresql://localhost:5432/timedeposit
spring.datasource.username=timedeposit
spring.datasource.password=timedeposit
