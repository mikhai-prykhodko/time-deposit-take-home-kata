name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit tests plus the Docker-backed integration tests (Docker is preinstalled on the runner).
      - name: Verify
        run: mvn -B verify

      - name: Mutation testing
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Upload test and mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            java/target/surefire-reports
            java/target/failsafe-reports
            java/target/pit-reports
