openapi: 3.0.3
info:
  title: XA Bank Time Deposits API
  version: 1.0.0
  description: |
    Two operations on the time deposits stored in the database.

    Assumptions:
    * Updating balances applies ONE month of interest per call, so calling it twice applies it twice.
      Because of this the operation is a POST and is not idempotent.
    * `days` is never changed by the update; it describes the age of the deposit.
    * Amounts are plain JSON numbers with two decimals.
tags:
  - name: TimeDeposits
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: listTimeDeposits
      summary: Get all time deposits
      responses:
        '200':
          description: Every time deposit with its withdrawals, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDepositResponse'
  /time-deposits/balance-updates:
    post:
      tags: [TimeDeposits]
      operationId: updateAllBalances
      summary: Update the balance of every time deposit
      description: Applies one month of interest, according to each deposit's plan type, to every time deposit.
      responses:
        '204':
          description: All balances were updated
components:
  schemas:
    TimeDepositResponse:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          example: basic
        balance:
          type: number
          format: double
          example: 1000.00
        days:
          type: integer
          format: int32
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalResponse'
    WithdrawalResponse:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          format: double
          example: 100.00
        date:
          type: string
          format: date
          example: '2024-01-15'
